<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bijendra Singh | Rhydburg Pharmaceuticals Ltd.</title>
<style>
  :root{
    --blue:#0d6fc4;
    --dark:#0a1a2b;
    --light:#f4f7fb;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Segoe UI', Arial, sans-serif;
    background:linear-gradient(135deg,#0a1a2b,#123a5e);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .card{
    background:#fff;
    width:100%;
    max-width:380px;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,0.4);
  }
  .banner{
    background:#ffffff;
    height:110px;
    position:relative;
    border-bottom:1px solid #eee;
  }
  .logo{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    width:170px;
  }
  .photo-wrap{
    display:flex;
    justify-content:center;
    margin-top:-20px;
  }
  .photo{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    object-position:center 20%;
    border:5px solid #fff;
    box-shadow:0 4px 15px rgba(0,0,0,0.25);
  }
  .info{
    text-align:center;
    padding:14px 24px 6px;
  }
  .info h1{
    font-size:22px;
    color:var(--dark);
  }
  .info p.role{
    color:var(--blue);
    font-weight:600;
    margin-top:2px;
    font-size:14px;
  }
  .info p.company{
    color:#555;
    font-size:13px;
    margin-top:2px;
  }
  .divider{
    height:1px;
    background:#e5e5e5;
    margin:16px 24px;
  }
  .contacts{
    padding:0 24px 24px;
  }
  .contact-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 0;
    text-decoration:none;
    color:var(--dark);
    font-size:14px;
    border-bottom:1px solid #f0f0f0;
  }
  .contact-item:last-child{border-bottom:none;}
  .icon{
    width:36px;
    height:36px;
    border-radius:50%;
    background:var(--light);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    flex-shrink:0;
  }
  .actions{
    display:flex;
    gap:10px;
    padding:0 24px 24px;
  }
  .btn{
    flex:1;
    text-align:center;
    padding:12px 0;
    border-radius:30px;
    font-size:14px;
    font-weight:600;
    text-decoration:none;
    color:#fff;
  }
  .btn.save{background:var(--blue);}
  .btn.wa{background:#25D366;}
  footer{
    text-align:center;
    font-size:11px;
    color:#aaa;
    padding-bottom:16px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="banner">
    <img src="assets/logo.png" alt="Rhydburg Pharmaceuticals Ltd." class="logo">
  </div>

  <div class="photo-wrap">
    <img src="assets/photo.png" alt="Bijendra Singh" class="photo">
  </div>

  <div class="info">
    <h1>Bijendra Singh</h1>
    <p class="role">AGM – Operations</p>
    <p class="company">Rhydburg Pharmaceuticals Ltd.</p>
  </div>

  <div class="divider"></div>

  <div class="contacts">
    <a href="tel:+919917633888" class="contact-item">
      <span class="icon">📞</span> +91 99176 33888
    </a>
    <a href="https://wa.me/919917633888" target="_blank" class="contact-item">
      <span class="icon">💬</span> WhatsApp: +91 99176 33888
    </a>
    <a href="mailto:bijendra.singh@rhydburg.com" class="contact-item">
      <span class="icon">✉️</span> bijendra.singh@rhydburg.com
    </a>
    <a href="https://www.rplglobal.com" target="_blank" class="contact-item">
      <span class="icon">🌐</span> www.rplglobal.com
    </a>
  </div>

  <div class="actions">
    <a href="Bijendra_Singh.vcf" download class="btn save">Save Contact</a>
    <a href="https://wa.me/919917633888" target="_blank" class="btn wa">WhatsApp</a>
  </div>

  <footer>Digital Visiting Card</footer>
</div>

</body>
</html>
